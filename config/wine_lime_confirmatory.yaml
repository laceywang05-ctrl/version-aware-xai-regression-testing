project:
  name: version-aware-xai-regression-testing

experiment:
  id: wine-lime-confirmatory-v1
  output_dir: artifacts/experiment_19_wine_lime_confirmatory

dataset:
  name: wine_binary
  test_size: 0.30
  split_seed: 42
  probe_size: 30

model:
  family: random_forest
  n_estimators: 200
  class_weight: balanced
  reference_seed: 42
  benign_seeds: [7, 21, 55, 84, 126, 168, 210, 252, 294, 336]
  candidate:
    random_seed: 99
    max_depth: null
    min_samples_leaf: 5

explainer:
  method: lime
  target_class: wine_class_1

lime:
  baseline_seed: 42
  repeated_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030]
  evaluation_seeds: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010, 3011, 3012, 3013, 3014, 3015, 3016, 3017, 3018, 3019, 3020, 3021, 3022, 3023, 3024, 3025, 3026, 3027, 3028, 3029, 3030]
  probe_size: 20
  num_samples: 1000
  kernel_width: null
  discretize_continuous: true
  output_dir: artifacts/experiment_19_wine_lime_confirmatory

comparison:
  top_k: 5
  metrics:
    - cosine_similarity
    - rank_correlation
    - top_k_overlap
    - direction_flip_rate

policy:
  lower_quantile: 0.05
  upper_quantile: 0.95
