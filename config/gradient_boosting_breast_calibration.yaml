project:
  name: version-aware-xai-regression-testing

experiment:
  id: breast-cancer-gradient-boosting-shap-heldout-v1
  output_dir: artifacts/experiment_28_breast_gradient_boosting

dataset:
  name: breast_cancer
  test_size: 0.25
  split_seed: 42
  probe_size: 100

model:
  family: gradient_boosting
  n_estimators: 100
  class_weight: balanced
  reference_seed: 42
  benign_seeds:
    [7, 14, 21, 35, 55, 63, 77, 84, 105, 126,
     140, 168, 182, 210, 224, 252, 266, 294, 308, 336,
     350, 378, 406, 434, 462, 490, 518, 546, 574, 602]
  candidate:
    random_seed: 853
    max_depth: 1
    min_samples_leaf: 5

explainer:
  method: tree_shap
  target_class: malignant

comparison:
  top_k: 5
  metrics:
    - cosine_similarity
    - rank_correlation
    - top_k_overlap
    - direction_flip_rate

policy:
  lower_quantile: 0.05
  upper_quantile: 0.95
