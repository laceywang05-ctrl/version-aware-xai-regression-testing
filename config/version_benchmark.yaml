benchmark:
  output_dir: artifacts/experiment_09_version_benchmark

scenarios:
  - id: seed_only_control
    change_type: control
    description: Same model settings with a new random seed
    random_seed: 99
    max_depth: null
    min_samples_leaf: 1

  - id: shallow_depth
    change_type: model_configuration
    description: Limit tree depth while retaining the default leaf size
    random_seed: 99
    max_depth: 4
    min_samples_leaf: 1

  - id: larger_leaves
    change_type: model_configuration
    description: Increase minimum leaf size without limiting tree depth
    random_seed: 99
    max_depth: null
    min_samples_leaf: 5

  - id: constrained_candidate
    change_type: model_configuration
    description: Combine shallow trees with larger leaves
    random_seed: 99
    max_depth: 4
    min_samples_leaf: 5
