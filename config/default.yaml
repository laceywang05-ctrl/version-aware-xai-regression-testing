project:
  name: version-aware-xai-regression-testing

experiment:
  id: breast-cancer-shap-v1
  output_dir: artifacts/experiment_05_real_dataset

dataset:
  name: breast_cancer
  test_size: 0.25
  split_seed: 42
  probe_size: 100

model:
  family: random_forest
  n_estimators: 200
  class_weight: balanced
  reference_seed: 42
  benign_seeds:
    - 7
    - 21
    - 55
    - 84
    - 126
    - 168
    - 210
    - 252
    - 294
    - 336
  candidate:
    random_seed: 99
    max_depth: 4
    min_samples_leaf: 5

explainer:
  method: tree_shap
  target_class: malignant

comparison:
  top_k: 5
  metrics:
    - cosine_similarity
    - rank_correlation
    - top_k_overlap
    - direction_flip_rate

policy:
  lower_quantile: 0.05
  upper_quantile: 0.95
