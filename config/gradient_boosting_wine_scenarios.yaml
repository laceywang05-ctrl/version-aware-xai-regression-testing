benchmark:
  output_dir: artifacts/experiment_29_wine_gradient_boosting

scenarios:
  - id: seed_only_control
    change_type: control
    description: Same wine gradient-boosting settings with a held-out random seed
    random_seeds: &heldout_seeds
      [853, 877, 901, 925, 949, 973, 997, 1021, 1045, 1069,
       1093, 1117, 1141, 1165, 1189, 1213, 1237, 1261, 1285, 1309,
       1333, 1357, 1381, 1405, 1429, 1453, 1477, 1501, 1525, 1549]
    max_depth: null
    min_samples_leaf: 1

  - id: shallow_depth
    change_type: model_configuration
    description: Reduce wine gradient-boosting tree depth from 3 to 1
    random_seeds: *heldout_seeds
    max_depth: 1
    min_samples_leaf: 1

  - id: larger_leaves
    change_type: model_configuration
    description: Increase minimum leaf size from 1 to 5 on the wine task
    random_seeds: *heldout_seeds
    max_depth: null
    min_samples_leaf: 5

  - id: constrained_candidate
    change_type: model_configuration
    description: Combine depth 1 and minimum leaf size 5 on the wine task
    random_seeds: *heldout_seeds
    max_depth: 1
    min_samples_leaf: 5
