[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "version-aware-xai-regression-testing"
version = "0.1.0"
description = "Compare explanation artifacts across machine-learning model versions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.5,<2",
    "lime>=0.2.0.1,<0.3",
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=20,<23",
    "pyyaml>=6,<7",
    "scikit-learn>=1.7,<2",
    "shap>=0.48,<0.51",
    "shap-monitor>=0.0.12,<0.1",
]

[project.scripts]
xai-regression = "xai_regression.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
